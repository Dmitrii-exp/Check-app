name: Create Android signing key (one time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate permanent signing key
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::First set ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets."
              exit 1
            fi
          done
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/check-app-release.jks" \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=Check App, OU=Mobile, O=Check App, C=RU"
          cp "$RUNNER_TEMP/check-app-release.jks" ./check-app-release.jks
      - name: Downloadable backup (keep private)
        uses: actions/upload-artifact@v4
        with:
          name: check-app-permanent-signing-key-PRIVATE
          path: check-app-release.jks
          retention-days: 1
          if-no-files-found: error
