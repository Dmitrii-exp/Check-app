name: Check App redesign validation
on:
  push:
    branches: [design/ui-ux-pro-max]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build production CSS
        run: npm run build:css
      - name: Validate JavaScript syntax
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check inline handlers and secrets
        run: node scripts/audit-js.mjs
      - name: Verify department Excel exports
        run: node scripts/test-report-export.mjs
      - name: Verify engine-hour scheduling on isolated Postgres
        run: |
          npm install --no-save --package-lock=false @electric-sql/pglite@0.5.14
          node scripts/test-engine-hours-db.mjs
      - name: Build mobile assets
        run: npm run build:mobile
      - name: Verify generated artifacts
        run: |
          test -s css/tailwind.css
          test -s dist-mobile/index.html
          test -s dist-mobile/js/interface.js
