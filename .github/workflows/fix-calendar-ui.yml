name: Fix calendar UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calendar module
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/calendar.js')
          s = p.read_text(encoding='utf-8')

          start = s.index('    // Calendar is a common navigation tab')
          end = s.index('    bindCalendarControls();', start) + len('    bindCalendarControls();')
          replacement = '''    // Calendar is a common navigation tab and must be visible for every authenticated role.
    // Do not depend on manager-nav because that navigation is hidden for employees.
    const appScreen = document.getElementById('app-screen');
    if (appScreen && !document.getElementById('calendar-nav')) {
      const calendarNav = document.createElement('nav');
      calendarNav.id = 'calendar-nav';
      calendarNav.className = 'bg-slate-900 border-b border-slate-800';
      calendarNav.style.display = 'block';
      calendarNav.innerHTML = `
        <div class="max-w-5xl mx-auto px-2 flex overflow-x-auto scroll-thin">
          <button type="button" data-page="calendar" class="nav-btn flex-shrink-0 px-4 py-3 text-sm font-medium border-b-2 border-primary-500 text-primary-400 hover:text-white transition">📅 Календарь</button>
        </div>`;
      const deptBar = document.getElementById('dept-bar');
      const managerNav = document.getElementById('manager-nav');
      if (deptBar?.parentNode === appScreen) {
        deptBar.insertAdjacentElement('afterend', calendarNav);
      } else if (managerNav?.parentNode === appScreen) {
        managerNav.insertAdjacentElement('beforebegin', calendarNav);
      } else {
        appScreen.appendChild(calendarNav);
      }
      calendarNav.querySelector('[data-page="calendar"]')?.addEventListener('click', () => window.showPage('calendar'));
    }

    bindCalendarControls();'''
          s = s[:start] + replacement + s[end:]

          s = s.replace("      const canComplete = !isDone && !isPlanned && task.date === todayStr();\n", "")
          marker = '              ${canComplete ? `<button type="button" onclick="openCompleteModal(\'${task.id}\')" class="bg-primary-600 hover:bg-primary-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition">Выполнить</button>` : \'\'}\n'
          s = s.replace(marker, '')

          old = '  injectCalendarUI();\n\n  const originalShowPage = window.showPage;'
          new = '''  function bootCalendar() {
    injectCalendarUI();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootCalendar, { once: true });
  } else {
    bootCalendar();
  }
  setTimeout(bootCalendar, 0);

  const originalShowPage = window.showPage;'''
          if old not in s:
              raise SystemExit('Calendar bootstrap marker not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/calendar.js
          if git diff --cached --quiet; then
            echo "No calendar changes needed"
          else
            git commit -m "Fix calendar visibility for all roles"
            git push
          fi
