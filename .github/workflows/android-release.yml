name: Publish signed Android update

on:
  workflow_dispatch:
  push:
    branches: [release/android-v1.2.10]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in repository secrets"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/check-app-release.jks"
      - run: npm install
      - run: npm run build:mobile
      - run: node scripts/audit-js.mjs
      - run: npx cap add android
      - run: npx cap sync android
      - run: node scripts/configure-mobile-links.mjs android
      - name: Configure release version and signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/configure-android-release.mjs
          cat >> android/gradle.properties <<EOF
          CHECKAPP_STORE_FILE=$RUNNER_TEMP/check-app-release.jks
          CHECKAPP_STORE_PASSWORD=$STORE_PASSWORD
          CHECKAPP_KEY_ALIAS=$KEY_ALIAS
          CHECKAPP_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          chmod 600 android/gradle.properties
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Verify packaged interface and upgrade signing certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify-android-apk.py android/app/build/outputs/apk/release/app-release.apk
          mkdir -p "$RUNNER_TEMP/previous-apk"
          gh release download v1.2.9 --repo "${{ github.repository }}" --pattern 'Check-App-v1.2.9.apk' --dir "$RUNNER_TEMP/previous-apk"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/new-signature.txt"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/previous-apk/Check-App-v1.2.9.apk" > "$RUNNER_TEMP/old-signature.txt"
          grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/new-signature.txt" > "$RUNNER_TEMP/new-cert.txt"
          grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/old-signature.txt" > "$RUNNER_TEMP/old-cert.txt"
          test -s "$RUNNER_TEMP/new-cert.txt"
          cmp "$RUNNER_TEMP/new-cert.txt" "$RUNNER_TEMP/old-cert.txt"
          "$BUILD_TOOLS/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk | awk 'NR==1' | grep "package: name='ru.checkapp.mobile' versionCode='10210' versionName='1.2.10'"
          echo 'Verified APK signature matches v1.2.9 and Android version increased to 1.2.10 (10210).'
      - name: Publish GitHub Release with changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/create-release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Check-App-v$VERSION.apk"
          gh release create "v$VERSION" "$RUNNER_TEMP/Check-App-v$VERSION.apk" --target "$GITHUB_SHA" --title "Check App v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --latest || {
            echo "::error::Release tag already exists or release publishing failed. Bump package.json version for a new release."
            exit 1
          }
      - name: Deploy release download to REG.RU with backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-reg-ru.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
