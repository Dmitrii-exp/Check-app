name: Add calendar loader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-calendar-loader:
    if: ${{ !contains(github.event.head_commit.message, 'Add calendar loader') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add calendar script
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          loader = '  <script src="js/calendar.js"></script>\n'
          if 'src="js/calendar.js"' not in text:
              marker = '  <script src="js/app.js"></script>\n'
              if marker not in text:
                  raise SystemExit('js/app.js script tag not found')
              text = text.replace(marker, marker + loader, 1)
              path.write_text(text, encoding='utf-8')
          else:
              print('Calendar loader already present')

      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add calendar script to app"
          git push
