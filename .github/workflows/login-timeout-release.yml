name: Release login timeout fix

on:
  push:
    branches: [codex/login-timeout-release]

permissions:
  contents: read

concurrency:
  group: check-app-reg-ru-deploy
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in repository secrets"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/check-app-release.jks"
      - run: npm install
      - run: npm run build:mobile
      - run: node scripts/audit-js.mjs
      - run: npx cap add android
      - run: npx cap sync android
      - run: node scripts/configure-mobile-links.mjs android
      - name: Configure release version and signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/configure-android-release.mjs
          cat >> android/gradle.properties <<EOF
          CHECKAPP_STORE_FILE=$RUNNER_TEMP/check-app-release.jks
          CHECKAPP_STORE_PASSWORD=$STORE_PASSWORD
          CHECKAPP_KEY_ALIAS=$KEY_ALIAS
          CHECKAPP_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          chmod 600 android/gradle.properties
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Publish GitHub Release with changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/create-release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Check-App-v$VERSION.apk"
          gh release create "v$VERSION" "$RUNNER_TEMP/Check-App-v$VERSION.apk" --target "$GITHUB_SHA" --title "Check App v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --latest || {
            echo "::error::Release tag already exists or release publishing failed. Bump package.json version for a new release."
            exit 1
          }

  deploy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build production website
        run: npm run build:mobile
      - name: Audit JavaScript
        run: node scripts/audit-js.mjs
      - name: Prepare public landing, web application and direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist-mobile/app dist-mobile/downloads "$RUNNER_TEMP/check-app-apk"
          cp dist-mobile/index.html dist-mobile/app/index.html
          sed -i 's|<head>|<head><base href="/" />|' dist-mobile/app/index.html
          cp index.html dist-mobile/index.html
          cp robots.txt sitemap.xml dist-mobile/
          sed -i 's|<head>|<head><meta name="robots" content="noindex,nofollow" />|' dist-mobile/app/index.html
          VERSION=$(node -p "require('./package.json').version")
          gh release download "v$VERSION" --repo "${{ github.repository }}" --pattern '*.apk' --dir "$RUNNER_TEMP/check-app-apk"
          APK_FILE=$(find "$RUNNER_TEMP/check-app-apk" -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK_FILE" || { echo "::error::No signed APK found in v$VERSION release"; exit 1; }
          cp "$APK_FILE" dist-mobile/downloads/Check-App.apk
          test -s dist-mobile/downloads/Check-App.apk
      - name: Check deploy credentials
        env:
          FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          FTP_USER: ${{ secrets.REG_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: |
          for value in "$FTP_HOST" "$FTP_USER" "$FTP_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::REG_FTP_HOST, REG_FTP_USER and REG_FTP_PASSWORD are required"
              exit 1
            fi
          done
      - name: Upload website over verified FTPS
        env:
          REG_FTP_HOST: ${{ secrets.REG_FTP_HOST }}
          REG_FTP_USER: ${{ secrets.REG_FTP_USER }}
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 scripts/deploy-reg-ru.py
      - name: Summary
        run: |
          echo 'Uploaded Check App files to dedicated REG.RU FTP root.' >> "$GITHUB_STEP_SUMMARY"
          echo 'DNS was not changed. Verify site and Supabase before switching DNS.' >> "$GITHUB_STEP_SUMMARY"
